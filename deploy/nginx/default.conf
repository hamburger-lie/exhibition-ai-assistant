# H5 同源访问 /api/*；SSE 响应必须原样透传，禁止缓存/缓冲，否则流式回答会被
# Nginx 攒批甚至挂起直到连接结束才一次性吐出。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # H5 是纯前端 SPA：非 /api 的路径统一回退到 index.html，由前端路由接管。
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Docker 内嵌 DNS。必须用变量形式的 proxy_pass 才会在每次请求时重新
        # 解析服务名——直接写 proxy_pass http://bff:3000 只在启动时解析一次，
        # 多实例（docker compose --scale）时会被钉死在其中一个容器上。
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $bff_upstream http://bff:3000;
        proxy_pass $bff_upstream$request_uri;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 关键：不缓存、不缓冲，SSE (message.delta 等事件) 才能实时透传给浏览器。
        proxy_cache off;
        proxy_buffering off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;

        add_header Cache-Control "no-cache, no-transform" always;
        add_header X-Accel-Buffering "no" always;
    }

    location /internal/ {
        # 仅供内网监控访问；生产环境务必用防火墙/内网段限制，不对公网开放。
        deny all;
    }
}
